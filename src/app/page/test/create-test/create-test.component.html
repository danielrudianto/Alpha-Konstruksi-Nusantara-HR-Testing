<mat-accordion>
  <mat-expansion-panel expanded>
    <mat-expansion-panel-header>
      <mat-panel-title> Test data </mat-panel-title>
    </mat-expansion-panel-header>
    <form [formGroup]="formGroup">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" type="text" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" type="text"></textarea>
      </mat-form-field>
    </form>
  </mat-expansion-panel>
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title> Questions </mat-panel-title>
    </mat-expansion-panel-header>
    <button mat-raised-button color="primary" (click)="addQuestion()">
      Add question
    </button>
  </mat-expansion-panel>
</mat-accordion>
