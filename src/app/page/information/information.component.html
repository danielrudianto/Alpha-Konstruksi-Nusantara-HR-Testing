<div class="background-shape"></div>
<form [formGroup]="metaFormGroup">
  <div class="container" data-aos="flip-up">
    <div class="row">
      <div class="col-lg-9 col-md-8 col-12">
        <div class="d-flex h-100 flex-column">
          <div style="flex-grow: 1">
            <h2 id="motto-text">Information</h2>
            <p>
              Mohon isikan curriculum vitae anda ke dalam format sebagai
              berikut.
            </p>
          </div>
          <div>
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Nama</mat-label>
              <input type="text" matInput formControlName="name" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Alamat</mat-label>
              <textarea matInput formControlName="address"></textarea>
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Kota</mat-label>
              <input type="text" matInput formControlName="city" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Tanggal lahir</mat-label>
              <input
                type="text"
                readonly
                (click)="picker.open()"
                matInput
                [matDatepicker]="picker"
                [max]="maxDate"
                [min]="minDate"
                formControlName="dateOfBirth"
              />
              <mat-datepicker-toggle
                matIconSuffix
                [for]="picker"
              ></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-4 col-12">
        <div class="d-flex h-100 flex-column">
          <img
            src="/assets/images/information.png"
            class="d-md-block d-none"
            alt="information"
          />
          <div>
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Nama Panggilan</mat-label>
              <input type="text" matInput formControlName="nickName" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Nomor telepon WA</mat-label>
              <input type="tel" matInput formControlName="phoneNumber" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Email</mat-label>
              <input type="email" matInput formControlName="email" />
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="col-12">
        <button
          class="button"
          [disabled]="!metaFormGroup.valid || isSubmitting"
          (click)="submit()"
        >
          Submit
        </button>
      </div>
    </div>
  </div>
</form>
