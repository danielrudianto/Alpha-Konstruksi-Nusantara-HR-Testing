<div class="container-fluid" id="login-body">
  <div class="login-page row">
    <div class="row m-auto">
      <div class="col-12">
        <div class="card m-0 p-0 shadow">
          <div class="card-body row p-0 justify-content-center">
            <div class="col-12 col-md-5">
              <form
                [formGroup]="loginFormGroup"
                class="d-flex flex-column gap-3 p-4"
                (ngSubmit)="login()"
              >
                <label
                  class="form-label fw-bold fs-3 h1 text-akn-blue mb-0"
                  for="login-form"
                  >Login</label
                >
                <p>
                  Selamat datang di divisi <i>Human Resource</i> PT. Alpha
                  Konstruksi Nusantara. Untuk pelaksanaan ujian mohon klik
                  <a routerLink="/">link ini.</a>
                </p>
                <div class="form-outline">
                  <label class="form-label" for="email">Username</label>
                  <input
                    type="text"
                    class="form-control mt-0"
                    [autofocus]="true"
                    placeholder="Username"
                    formControlName="username"
                  />
                </div>

                <div class="form-outline">
                  <label class="form-label" for="password">Password</label>
                  <input
                    type="password"
                    class="form-control mt-0"
                    [autofocus]="true"
                    placeholder="Password"
                    formControlName="password"
                  />
                </div>

                <!-- Checkbox untuk "ingat saya" -->
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    formControlName="rememberMe"
                  />
                  <label class="form-check-label" for="flexCheckDefault">
                    Ingat saya
                  </label>
                </div>

                <button
                  class="btn btn-akn-secondary col-12 mb-3"
                  type="submit"
                  [disabled]="!loginFormGroup.valid"
                >
                  Login
                </button>
              </form>
            </div>
            <div
              class="card-image-login d-none d-md-block"
              style="width: 57.5%"
            ></div>
          </div>
        </div>
        <div
          class="d-flex flex-row justify-content-end align-items-center gap-3"
        >
          <p class="mt-2">
            <small>Copyright © 2025 HRD Alpha Konstruksi Nusantara</small>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
